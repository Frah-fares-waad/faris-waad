<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>دعوة خطوبة فارس ووعد</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Cairo',sans-serif;
height:100vh;
overflow:hidden;
background:
linear-gradient(135deg,#8b001f,#ff0033);
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

/* الخلفية الذهبية */

.gold-particles{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
}

.gold-particles span{
position:absolute;
display:block;
width:4px;
height:4px;
background:#ccff00;
border-radius:50%;
animation:float 10s linear infinite;
opacity:.7;
}

@keyframes float{
0%{
transform:translateY(100vh) scale(0);
}
100%{
transform:translateY(-100px) scale(1);
}
}

.container{
position:relative;
width:100%;
max-width:420px;
display:flex;
justify-content:center;
align-items:center;
}

.envelope-wrapper{
position:relative;
width:330px;
height:220px;
background:#c4002a;
cursor:pointer;
border-radius:0 0 14px 14px;
box-shadow:0 20px 50px rgba(0,0,0,.4);
transition:.6s;
}

.envelope-flap{
position:absolute;
top:0;
left:0;
width:0;
height:0;
border-left:165px solid transparent;
border-right:165px solid transparent;
border-top:130px solid #9f0021;
transform-origin:top;
transition:.7s;
z-index:5;
}

.envelope-front{
position:absolute;
bottom:0;
width:0;
height:0;
border-left:165px solid #ff1848;
border-right:165px solid #ff1848;
border-bottom:110px solid #d7002d;
border-top:110px solid transparent;
}

.seal-btn{
position:absolute;
top:92px;
left:50%;
transform:translateX(-50%);
width:60px;
height:60px;
border-radius:50%;
background:#ccff00;
display:flex;
justify-content:center;
align-items:center;
font-size:25px;
z-index:10;
animation:pulse 1.4s infinite;
}

@keyframes pulse{
50%{
transform:translateX(-50%) scale(1.1);
}
}

.card{
position:absolute;
width:320px;
height:560px;
background:
linear-gradient(180deg,#b10026,#ff0033);
border:4px solid #ccff00;
border-radius:22px;
padding:20px;
text-align:center;
color:white;
box-shadow:0 20px 60px rgba(0,0,0,.4);

transform:translateY(100px) scale(.8);
opacity:0;
transition:.8s;

display:flex;
flex-direction:column;
justify-content:space-between;
}

.container.open .envelope-flap{
transform:rotateX(180deg);
}

.container.open .card{
opacity:1;
transform:translateY(-190px) scale(1);
}

.container.open .envelope-wrapper{
transform:translateY(130px);
}

.guest{
color:#ccff00;
font-weight:700;
font-size:15px;
}

.title{
font-size:14px;
color:#ccff00;
}

.names{
font-size:38px;
font-weight:900;
text-shadow:3px 3px #850018;
}

.badge{
background:white;
color:#ff0033;
padding:8px 18px;
border-radius:20px;
font-weight:900;
display:inline-block;
}

.countdown{
background:#ccff00;
color:black;
border-radius:12px;
padding:10px;
display:flex;
justify-content:space-between;
}

.countdown div{
flex:1;
font-size:12px;
}

.countdown span{
display:block;
font-size:22px;
font-weight:900;
}

.btn{
display:inline-block;
margin-top:8px;
padding:10px 15px;
border-radius:25px;
background:white;
color:#ff0033;
font-weight:800;
text-decoration:none;
}

.music-btn{
position:fixed;
top:20px;
left:20px;
background:#ccff00;
color:black;
border:none;
padding:10px 15px;
border-radius:30px;
font-weight:800;
cursor:pointer;
z-index:999;
}

</style></head><body><button class="music-btn" onclick="toggleMusic()">
🎵 تشغيل الموسيقى
</button><audio id="music" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8a13c0e95.mp3" type="audio/mpeg">
</audio><div class="gold-particles" id="particles"></div><div class="container" id="container"><div class="card"><div id="guestName" class="guest"></div><div class="title">
✨ نتشرف بحضوركم ومشاركتنا فرحتنا ✨
</div><div>
يسر الأستاذ / يسري فارس أبو الخير<br>
والأستاذ / محمد يسري أبو الخير
</div><div>
يدعونكم لحضور حفل خطوبة
</div><div class="names">
فارس & وعد
</div><div>
💍 ننتظر حضوركم لمشاركتنا أجمل لحظات العمر
</div><div class="badge">
07 / 07 / 2026
</div><div>
📍 قاعة كابتال - طلخا - المنصورة
</div><a
class="btn"
target="_blank"
href="https://maps.google.com/?q=393V+X8V+طلخا+الدقهلية">
📍 موقع القاعة
</a>

<a
class="btn"
target="_blank"
href="https://calendar.google.com">
📅 حفظ الموعد
</a>

<div class="countdown" id="timer"><div>
<span id="days">00</span>
يوم
</div><div>
<span id="hours">00</span>
ساعة
</div><div>
<span id="minutes">00</span>
دقيقة
</div><div>
<span id="seconds">00</span>
ثانية
</div></div></div><div class="envelope-wrapper" onclick="openInvite()">
<div class="envelope-flap"></div>
<div class="envelope-front"></div>
<div class="seal-btn">💌</div>
</div></div><script>

for(let i=0;i<60;i++){

let star=document.createElement("span");

star.style.left=Math.random()*100+"%";
star.style.animationDuration=(5+Math.random()*8)+"s";
star.style.opacity=Math.random();

document.getElementById("particles").appendChild(star);
}

function openInvite(){

document.getElementById("container")
.classList.add("open");

confetti({
particleCount:250,
spread:120,
origin:{y:.6}
});
}

function countdown(){

let target=
new Date("July 7, 2026 00:00:00").getTime();

let now=new Date().getTime();

let diff=target-now;

if(diff<0){
document.getElementById("timer").innerHTML=
"🎉 بدأت فرحتنا 🎉";
return;
}

let d=Math.floor(diff/(1000*60*60*24));

let h=Math.floor(
(diff%(1000*60*60*24))
/
(1000*60*60)
);

let m=Math.floor(
(diff%(1000*60*60))
/
(1000*60)
);

let s=Math.floor(
(diff%(1000*60))
/
1000
);

days.innerText=d;
hours.innerText=h;
minutes.innerText=m;
seconds.innerText=s;
}

countdown();
setInterval(countdown,1000);

function toggleMusic(){

let music=document.getElementById("music");

if(music.paused){

music.play();

document.querySelector(".music-btn")
.innerHTML="🔇 إيقاف الموسيقى";

}else{

music.pause();

document.querySelector(".music-btn")
.innerHTML="🎵 تشغيل الموسيقى";

}
}

const params=
new URLSearchParams(window.location.search);

const guest=
params.get("guest");

if(guest){

document.getElementById("guestName")
.innerHTML=
"أهلاً وسهلاً بالأستاذ " + guest + " 🌹";

}

</script></body>
</html>
