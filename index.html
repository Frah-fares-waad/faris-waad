<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف فارس ووعد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff0033;
            --secondary-color: #ccff00;
            --dark-red: #d6002a;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #ffeaee 0%, #ffb3c1 100%);
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
        }

        /* حاوية اللعبة كلها */
        .wrapper {
            position: relative;
            width: 390px;
            height: 550px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 30px;
            box-sizing: border-box;
        }

        /* حاوية الظرف الأساسية */
        .envelope-wrapper {
            position: relative;
            width: 360px;
            height: 240px;
            background-color: var(--primary-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border-radius: 0 0 10px 10px;
            cursor: pointer;
            z-index: 2;
        }

        /* الغطاء العلوي للظرف */
        .envelope-wrapper::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            border-top: 140px solid var(--dark-red);
            transform-origin: top;
            transition: transform 0.4s ease-in-out, z-index 0.2s ease-in-out;
            z-index: 4;
        }

        /* جيب الظرف السفلي */
        .envelope-wrapper::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 180px solid #ff1a4a;
            border-right: 180px solid #ff1a4a;
            border-bottom: 120px solid #e6002e;
            border-top: 120px solid transparent;
            border-radius: 0 0 10px 10px;
            z-index: 3;
        }

        /* كارت الدعوة المستخبي تماماً بالداخل */
        .wedding-card {
            position: absolute;
            bottom: 40px;
            width: 330px;
            height: 480px;
            background-color: var(--primary-color);
            border: 4px solid #ffffff;
            border-radius: 15px;
            padding: 25px 15px;
            box-sizing: border-box;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            transform: translateY(150px) scale(0.85);
            opacity: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        /* الاستايل عند تفعيل الفتح */
        .wrapper.open .envelope-wrapper::before {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .wrapper.open .wedding-card {
            transform: translateY(-90px) scale(1);
            opacity: 1;
            z-index: 5;
            pointer-events: auto;
        }

        /* الختم الدائري المفسفوري القافل للظرف */
        .heart-seal {
            position: absolute;
            top: 105px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            background-color: var(--secondary-color);
            border-radius: 50%;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000000;
            font-size: 20px;
            font-weight: 900;
            box-shadow: 0 0 15px var(--secondary-color), 0 4px 8px rgba(0,0,0,0.3);
            transition: opacity 0.3s ease, transform 0.3s ease;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
        }

        .wrapper.open .heart-seal {
            opacity: 0;
            pointer-events: none;
        }

        /* نصوص الكارت بالتفصيل */
        .txt-gold { color: var(--secondary-color); font-weight: 700; font-size: 14px; }
        .txt-hosts { font-size: 14px; font-weight: 600; line-height: 1.6; }
        .txt-main { font-size: 12px; opacity: 0.9; margin: 2px 0; }
        .txt-names { font-size: 30px; font-weight: 900; color: #ffffff; text-shadow: 2px 3px 0px #99001a; }
        
        .badge-date {
            background-color: #ffffff;
            color: var(--primary-color);
            font-weight: 900;
            padding: 6px 15px;
            border-radius: 25px;
            display: inline-block;
            margin: 5px auto;
            font-size: 14px;
        }

        /* العداد التنازلي الاستايل المفسفوري من رابط Vercel */
        .timer-container {
            display: flex;
            justify-content: space-around;
            background-color: var(--secondary-color);
            color: #000000;
            border-radius: 10px;
            padding: 8px 5px;
            font-weight: bold;
        }

        .timer-box { text-align: center; font-size: 11px; flex: 1; }
        .timer-box span { font-size: 22px; font-weight: 900; display: block; font-family: sans-serif; }
    </style>
</head>
<body>

    <div class="wrapper" id="mainWrapper">
        <!-- كارت الدعوة مخفي تماماً بالخلف تحت الـ Z-Index -->
        <div class="wedding-card">
            <div class="txt-gold">🎈 شرفونا ونورونا لتكتمل فرحتنا 🎈</div>
            <div class="txt-hosts">
                يسر الأستاذ / يسري فارس أبو الخير <br>
                و الأستاذ / محمد يسري أبو الخير
            </div>
            <div class="txt-main">دعوتكم لحضور حفل زفاف</div>
            <div class="txt-names">فارس & وعد</div>
            <div style="font-size: 20px; color: var(--secondary-color);">✨ ⭐ ✨</div>
            <div class="badge-date">التاريخ: 07 / 07 / 2026 م</div>
            <div class="txt-gold">📍 المكان: قاعة الأفراح - المنصورة</div>
            
            <div class="timer-container" id="timer">
                <div class="timer-box"><span id="d">00</span>يوم</div>
                <div class="timer-box"><span id="h">00</span>ساعة</div>
                <div class="timer-box"><span id="m">00</span>دقيقة</div>
            </div>
        </div>

        <!-- الظرف الأساسي والزرار المقفولين تماماً من البداية -->
        <div class="envelope-wrapper" onclick="openEnvelope()">
            <div class="heart-seal">✉</div>
        </div>
    </div>

    <script>
        // دالة التحكم في الفتح لمنع أي مشاكل في الرؤية المسبقة
        function openEnvelope() {
            document.getElementById('mainWrapper').classList.add('open');
        }

        // تشغيل عداد الوقت لـ تاريخ 7/7/2026
        function updateTimer() {
            const targetDate = new Date('July 7, 2026 00:00:00').getTime();
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff < 0) {
                document.getElementById('timer').innerHTML = "<div style='width:100%; font-weight:900;'>بدأ الفرح السعيد! 🎉</div>";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            document.getElementById('d').innerText = String(days).padStart(2, '0');
            document.getElementById('h').innerText = String(hours).padStart(2, '0');
            document.getElementById('m').innerText = String(minutes).padStart(2, '0');
        }

        updateTimer();
        setInterval(updateTimer, 60000);
    </script>
</body>
</html>
