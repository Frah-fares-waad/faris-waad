<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف فارس ووعد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة القصاصات المتطايرة التلقائية عند فتح الظرف -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffb3c1 100%);
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
        }

        /* تأثير الجزيئات الذهبية في الخلفية */
        .gold-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .gold-particles span {
            position: absolute;
            background: #D4AF37;
            border-radius: 50%;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); }
            100% { transform: translateY(105vh) rotate(360deg); }
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        /* تنسيق الظرف الخارجي وهيكل الختم */
        .envelope-wrapper {
            position: relative;
            width: 320px;
            height: 220px;
            background-color: #c0002a;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.35);
            cursor: pointer;
            z-index: 10;
            transition: transform 0.6s ease;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 130px solid #8a001e;
            transform-origin: top;
            transition: transform 0.5s ease-in-out;
            z-index: 12;
        }

        .envelope-front {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid #c0002a;
            border-right: 160px solid #c0002a;
            border-bottom: 110px solid #8a001e;
            border-top: 110px solid transparent;
            border-radius: 0 0 12px 12px;
            z-index: 11;
        }

        .seal-btn {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            width: 55px;
            height: 55px;
            background-color: #D4AF37;
            border-radius: 50%;
            z-index: 13;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 0 15px #D4AF37, 0 4px 10px rgba(0,0,0,0.3);
            animation: bounceBtn 1.2s infinite;
            transition: opacity 0.3s ease;
        }

        @keyframes bounceBtn {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
        }

        /* كارت الدعوة الملكي المطور */
        .card {
            position: absolute;
            width: 320px;
            height: 500px;
            background: linear-gradient(180deg, #8a001e, #c0002a, #ff0033);
            border: 3px solid #D4AF37;
            border-radius: 22px;
            padding: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 60px rgba(0,0,0,.45);
            z-index: 5;
            transform: translateY(100px) scale(.8);
            opacity: 0;
            transition: .8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        /* حركات الأنيميشن عند الفتح */
        .container.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 4;
        }

        .container.open .seal-btn {
            opacity: 0;
            pointer-events: none;
        }

        .container.open .card {
            opacity: 1;
            transform: translateY(-120px) scale(1);
            z-index: 20;
            pointer-events: auto;
        }

        .container.open .envelope-wrapper {
            transform: translateY(140px);
            pointer-events: none;
        }

        .guest {
            color: #D4AF37;
            font-size: 15px;
            font-weight: 700;
        }

        .title {
            color: #D4AF37;
            font-size: 15px;
            font-weight: 700;
        }

        .names {
            font-size: 38px;
            font-weight: 900;
            text-shadow: 3px 3px #600012;
        }

        .badge {
            background: white;
            color: #c0002a;
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: 900;
            display: inline-block;
            margin: 0 auto;
        }

        .countdown {
            background: #D4AF37;
            color: #000;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .countdown div {
            flex: 1;
            font-size: 12px;
            text-align: center;
        }

        .countdown span {
            display: block;
            font-size: 22px;
            font-weight: 900;
            font-family: sans-serif;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            background: white;
            color: #c0002a;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 800;
            margin-top: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
    </style>
</head>

<body>

    <!-- حاوية الجزيئات الذهبية المتساقطة -->
    <div class="gold-particles" id="particles"></div>

    <div class="container" id="container">

        <!-- كارت الدعوة الرئيسي -->
        <div class="card">
            <div id="guestName" class="guest"></div>

            <div class="title">
                ✨ نتشرف بحضوركم ومشاركتنا فرحتنا ✨
            </div>

            <div>
                يسر الأستاذ / يسري فارس أبو الخير<br>
                والأستاذ / محمد يسري أبو الخير
            </div>

            <div>
                يدعونكم لحضور حفل زفاف
            </div>

            <div class="names">
                فارس & وعد
            </div>

            <div>
                💍 ننتظر حضوركم لمشاركتنا أجمل لحظات العمر
            </div>

            <div class="badge">
                07 / 07 / 2026
            </div>

            <div>
                📍 قاعة كابتال - طلخا - المنصورة
            </div>

            <a class="btn" href="https://maps.google.com/?q=393V+X8V+طلخا+الدقهلية" target="_blank">
                📍 موقع القاعة
            </a>

            <!-- العداد التنازلي التفاعلي المباشر بالثواني -->
            <div class="countdown" id="timer">
                <div>
                    <span id="days">00</span>يوم
                </div>
                <div>
                    <span id="hours">00</span>ساعة
                </div>
                <div>
                    <span id="minutes">00</span>دقيقة
                </div>
                <div>
                    <span id="seconds">00</span>ثانية
                </div>
            </div>
        </div>

        <!-- شكل الظرف المحكم والختم -->
        <div class="envelope-wrapper" onclick="openInvite()">
            <div class="envelope-flap"></div>
            <div class="envelope-front"></div>
            <div class="seal-btn">💌</div>
        </div>

    </div>

    <script>
        // دالة فتح الدعوة والقصاصات المتطايرة
        function openInvite() {
            document.getElementById("container").classList.add("open");

            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        // إنشاء الجزيئات الذهبية بشكل عشوائي مميز
        const particlesContainer = document.getElementById("particles");
        for (let i = 0; i < 60; i++) {
            const span = document.createElement("span");
            span.style.left = Math.random() * 100 + "vw";
            span.style.animationDuration = (5 + Math.random() * 10) + "s";
            span.style.opacity = Math.random();
            span.style.width = span.style.height = (2 + Math.random() * 4) + "px";
            particlesContainer.appendChild(span);
        }

        // كود العداد التنازلي المباشر بالثانية
        const eventDate = new Date("2026-07-07T00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const diff = eventDate - now;

            if (diff <= 0) {
                document.getElementById('timer').innerHTML = "<div style='width:100%; font-weight:900; font-size:14px; text-align:center; color:#000;'>فرحتنا بدأت الآن! 🎉</div>";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("days").textContent = String(days).padStart(2, "0");
            document.getElementById("hours").textContent = String(hours).padStart(2, "0");
            document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
            document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
